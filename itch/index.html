<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flamey's Official Animation Studio</title>
    <!-- Upload this one file to itch.io once. It always shows the newest studio from GitHub,
         so updating GitHub updates itch.io too. -->
    <style>
      html, body { margin: 0; height: 100%; background: #1b1c1e; overflow: hidden; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
      a {
        position: fixed; right: 8px; bottom: 8px; z-index: 2;
        font: 700 12px system-ui, sans-serif; color: #fff; text-decoration: none;
        background: rgba(133, 92, 214, 0.9); padding: 6px 10px; border-radius: 8px; opacity: 0.75;
      }
      a:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <iframe
      src="https://flameyter.github.io/Flamey-s-Animation-Studio/"
      allow="fullscreen; microphone; clipboard-read; clipboard-write; autoplay"
      allowfullscreen
    ></iframe>
    <a href="https://flameyter.github.io/Flamey-s-Animation-Studio/" target="_blank" rel="noopener">↗ Open in new tab</a>
  </body>
</html>
